name: Check for MATLAB MCP Server updates

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      verify_current:
        description: Also verify the binary when the formula is already up to date
        type: boolean
        default: true

permissions: {}

concurrency:
  group: formula-autobump
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'padhialuo0426/homebrew-matlab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
      outdated: ${{ steps.release.outputs.outdated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the official release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/matlab/matlab-mcp-server/releases/latest > "$RUNNER_TEMP/matlab-release.json"
          python3 .github/scripts/matlab_release.py probe "$RUNNER_TEMP/matlab-release.json" >> "$GITHUB_OUTPUT"

  verify:
    needs: check
    if: needs.check.outputs.outdated == 'true' || (github.event_name == 'workflow_dispatch' && inputs.verify_current)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Verify the official Apple Silicon binary
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          SHA256: ${{ needs.check.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$SHA256" =~ ^[a-f0-9]{64}$ ]]
          bin="$RUNNER_TEMP/matlab-mcp-server"
          url="https://github.com/matlab/matlab-mcp-server/releases/download/v$VERSION/matlab-mcp-server-macos-arm64"
          curl --fail --silent --show-error --location --proto '=https' --max-time 180 --retry 2 --output "$bin" "$url"
          printf '%s  %s\n' "$SHA256" "$bin" | shasum -a 256 -c -
          codesign --verify --strict -R='anchor apple generic and certificate leaf[subject.OU] = "94DN422U8R"' "$bin"
          chmod 0755 "$bin"
          version_output="$("$bin" --version)"
          [[ "$version_output" == "github.com/matlab/matlab-mcp-server v$VERSION" ]]
          printf 'Verified MathWorks signature and executable version: %s\n' "$version_output"

  publish:
    needs: [check, verify]
    if: needs.check.outputs.outdated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish and merge the verified formula update
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA256: ${{ needs.check.outputs.sha256 }}
        run: bash .github/scripts/publish_matlab_update.sh
