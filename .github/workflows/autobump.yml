name: Check for MATLAB MCP Server updates

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: formula-autobump
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'padhialuo0426/homebrew-matlab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
        id: brew
      - uses: Homebrew/actions/git-user-config@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
        id: git
      - name: Open a PR if the formula is outdated
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git.outputs.email }}
          TAP_NAME: ${{ steps.brew.outputs.tap-name }}
        run: |
          formula="$TAP_NAME/matlab-mcp-server"
          brew trust --formula "$formula"
          brew bump --no-fork --open-pr --formula "$formula"
